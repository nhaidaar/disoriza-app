name: disoriza
description: "A new Flutter project."
publish_to: "none"

version: 1.0.1+2

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  animated_snack_bar: ^0.4.0
  cached_network_image: ^3.4.1
  card_loading: ^0.3.2
  carousel_slider: ^5.0.0
  cupertino_icons: ^1.0.8
  device_info_plus: ^12.3.0
  dots_indicator: ^4.0.1
  figma_squircle: ^0.6.3
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  fpdart: ^1.1.1
  get: ^4.6.6
  http: ^1.2.2
  iconsax_plus: ^1.0.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  permission_handler: ^12.0.1
  scroll_to_index: ^3.0.1
  supabase_flutter: ^2.8.1
  timeago: ^3.7.0

dev_dependencies:
  change_app_package_name: ^1.4.0
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.13

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/ic_launcher.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
  fonts:
    - family: InterTight
      fonts:
        - asset: assets/fonts/InterTight-Regular.ttf
          weight: 400
        - asset: assets/fonts/InterTight-Medium.ttf
          weight: 500
        - asset: assets/fonts/InterTight-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterTight-Bold.ttf
          weight: 700
